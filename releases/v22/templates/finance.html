<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>销售额看板 · Etsy 工具台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  <script defer src="{{ url_for('static', filename='finance.js') }}"></script>
</head>
<body>
<div class="app-shell">
  {% include 'sidebar.html' %}
  <main class="main">
    <div class="content dashboard-content">
      <div class="page-heading"><h1>销售额看板</h1><span class="data-badge simulated">模拟 · USD</span></div>
      <div class="chart-grid">{% for card in cards %}
        <article class="chart-card">
          <h2>{{ card.shop.internal_shop_id or '' }} {{ card.shop.name }}</h2>
          {% include 'finance_legend.html' %}
          <div class="finance-chart" data-rows='{{ card.rows|tojson }}'></div>
        </article>
      {% else %}<p class="chart-empty">暂无销售额</p>{% endfor %}</div>
    </div>
  </main>
</div>
</body>
</html>

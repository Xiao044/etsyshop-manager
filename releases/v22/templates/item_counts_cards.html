<div class="chart-grid">
{% for card in cards %}
  <article class="chart-card product-card">
    {{ shop_card.heading(card, days) }}
    {{ products.summary(card.item_counts, today, format_value) }}
    {{ products.chart(card.item_counts, first_day, today, format_value) }}
  </article>
{% else %}<p class="chart-empty">{{ '暂无符合筛选的店铺' if operator_id else '请先添加店铺' }}</p>{% endfor %}
</div>
